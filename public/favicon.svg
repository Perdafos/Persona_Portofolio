<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="128" height="128" rx="20" fill="#080808" />

  <!-- Persona Red Diagonal Banner -->
  <path d="M -10 25 L 138 -5 L 110 138 L -10 110 Z" fill="#E60012" />

  <!-- Persona Blue Sharp Slanted Overlay -->
  <path d="M 20 20 L 115 10 L 95 115 L 10 105 Z" fill="#00A6E8" filter="url(#shadow)" />

  <!-- White Frame Box -->
  <path d="M 28 28 L 100 20 L 88 98 L 20 90 Z" fill="#FFFFFF" stroke="#000000" stroke-width="3" />

  <!-- Main Monogram 'P' Persona Styled -->
  <text x="35" y="78" font-family="'Anton', 'Archivo Black', Impact, sans-serif" font-size="62" font-weight="900" fill="#000000" transform="rotate(-6 35 78)">P</text>

  <!-- Persona Star on Top Right -->
  <path d="M 95 18 L 100 30 L 112 30 L 102 38 L 106 50 L 95 42 L 84 50 L 88 38 L 78 30 L 90 30 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#shadow)" />
</svg>
